<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Recipe</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #004643; margin: 0; padding: 40px; color: #fffffe; }
        .card { background-color: #e8e4e6; border-radius: 12px; padding: 30px; max-width: 600px; margin: 0 auto; color: #001e1d; }
        h1 { color: #001e1d; border-bottom: 2px solid #f9bc60; padding-bottom: 10px; }
        form p { display: flex; flex-direction: column; }
        label { font-weight: bold; color: #e16162; margin-bottom: 5px; }
        input[type="text"], textarea { padding: 8px; border-radius: 6px; border: 1px solid #abd1c6; font-family: inherit; }
        button { margin-top: 15px; padding: 10px 20px; border: none; border-radius: 6px; background-color: #f9bc60; color: #001e1d; font-weight: bold; cursor: pointer; }
        a { color: #fffffe; display: block; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Add New Recipe</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Recipe</button>
        </form>
    </div>
    <a href="{% url 'recipe_list' %}">← Back to Recipe List</a>
</body>
</html>
