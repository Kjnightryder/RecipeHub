<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ recipe.title }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #004643; margin: 0; padding: 40px; color: #fffffe; }
        .card { background-color: #e8e4e6; border-radius: 12px; padding: 30px; max-width: 600px; margin: 0 auto; color: #001e1d; }
        h1 { color: #001e1d; border-bottom: 2px solid #f9bc60; padding-bottom: 10px; }
        .label { font-weight: bold; color: #e16162; }
        a { color: #fffffe; display: block; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ recipe.title }}</h1>
        <p><span class="label">Ingredients:</span> {{ recipe.ingredients }}</p>
        <p><span class="label">Instructions:</span> {{ recipe.instructions }}</p>
    </div>
    <a href="{% url 'recipe_list' %}">← Back to Recipe List</a>
    <a href="{% url 'delete_recipe' recipe.id %}">Delete Recipe</a>
</body>
</html>
